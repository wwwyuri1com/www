<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <title>YURI NO1 – Girls Love ♡ AI Novels &amp; Prompts</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 36px 24px;
      background: #FFFFFF;
      color: #FA6699;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }
    .brand {
      margin: 0 0 60px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.28em;
      line-height: 1.5;
    }
    .symbol {
      width: 50px;
      height: 50px;
      margin: 0 auto 32px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 300;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 54px);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.15;
    }
    .line {
      width: 54px;
      height: 2px;
      margin: 30px auto;
      background: currentColor;
      opacity: 0.65;
    }
    p {
      max-width: 530px;
      margin: 0 auto;
      font-size: clamp(16px, 3vw, 19px);
      line-height: 1.85;
      font-weight: 400;
      letter-spacing: 0.005em;
    }
    @media (max-width: 480px) {
      .brand { margin-bottom: 48px; }
      .symbol { width: 44px; height: 44px; margin-bottom: 28px; }
      .line { margin: 26px auto; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="brand">YURI NO1</div>
    <div class="symbol" aria-hidden="true">✧</div>
    <h1 id="page-title">Website Update</h1>
    <div class="line" aria-hidden="true"></div>
    <p>Our website system is currently undergoing updates; we expect to resume service within 48 hours.</p>
  </main>
</body>
</html>
