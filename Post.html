<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>POST \ Derive Dimension Demon Official Website</title>

    <!-- Config Loader -->
    <link rel="stylesheet" href="Config/css/guide.css">
    <link rel="stylesheet" href="Config/css/theme.css">

    <!-- Plug-in Loader -->
    <link rel="stylesheet" href="Config/plug-in/post-loader/post-loader.css">
    <script src="Config/plug-in/post-loader/post-loader.js" defer></script>
</head>

<body>
<div class="out-warper"><!-- out-warper lock max-width -->

<header>
    <div class="logo">
        <a href="index.html">
            <img src="Config/img/icon-xs.png">
        </a>
    </div>
</header>

<main-warper>

<!-- 本頁特有內容 START -->

<div id="post-loader" class="post-loader">

    <!-- JS fills the existing DOM below. -->
    <!--
      Post Loader structure:

      <div class="post-catalog post"></div>

      <div class="post-images post">
          JS generates:
          <div class="post-image post"><img ...></div>
          <div class="post-image post"><img ...></div>
          ...
      </div>

      <div class="post-date post"></div>
      <div class="post-title post"><h2>...</h2></div>
      <div class="post-text post"><p>...</p></div>
      <div class="post-related post"><span>...</span></div>
      <div class="post-tag post"><span>...</span></div>
      <div class="post-readmore post">
          <span></span>
          <span></span>
      </div>
    -->

    <div class="post-catalog post"><span></span></div>
    <div class="post-images post"></div>
    <div class="post-date post"><span></span></div>
    <div class="post-title post"><h2></h2></div>
    <div class="post-text post"><p></p></div>
    <div class="post-related post"><span></span></div>
    <div class="post-tag post"><span></span></div>
    <div class="post-readmore post" hidden>
        <span></span>
        <span></span>
    </div>

</div>

<!-- 本頁特有內容 END -->

</main-warper>

<footer>
    <span>© Produced by Derive Dimension Demon</span>
</footer>

</div>
</body>
</html>
