<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>READ \ YURI1♡Short Novel IPs in Girls' Love</title>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.47.0"></script>

    <!-- Config Loader -->
    <link rel="stylesheet" href="Config/css/guide.css">
    <link rel="stylesheet" href="Config/css/theme.css">

    <!-- Plug-in Loader -->
    <!-- Candy -->
    <link rel="stylesheet" href="Config/plug-in/candy-loader/candy-loader.css">
    <script src="Config/plug-in/candy-loader/candy-loader.js" defer></script>
    <!-- Codex -->
    <link rel="stylesheet" href="Config/plug-in/codex-loader/codex-loader.css">
    <script src="Config/plug-in/codex-loader/codex-loader.js" defer></script>
    <!-- Post -->
    <link rel="stylesheet" href="Config/plug-in/post-loader/post-loader.css">
    <script src="Config/plug-in/post-loader/post-loader.js" defer></script>
    <!-- Ai version system -->
    <link rel="stylesheet" href="Config/plug-in/ai-loader/ai-loader.css">
    <script src="Config/plug-in/ai-loader/ai-loader.js" defer></script>
    <!-- Reader -->
    <link rel="stylesheet" href="Config/plug-in/reader-loader/reader-loader.css">
    <script src="Config/plug-in/reader-loader/reader-loader.js" defer></script>
</head>

<body>
<div class="out-warper"><!-- out-warper lock max-width -->

  <header class="ai-header">
  <div class="logo"><a href="index.html"><img src="Config/img/icon-xs.png"></a></div>
  <!-- AI / Prompt / Handmade controls -->
  <div id="ai-loader" class="ai-loader">
    <div class="ai-btn a"></div>
    <div class="ai-btn h"></div>
    <div class="ai-btn p"></div>
  </div>
  <!-- 本頁特有頁首 START -->



<!-- 本頁特有頁首 END -->


</header>

<main-warper>

<!-- 本頁特有內容 START -->
<div id="post-loader" class="post-loader">

    <!-- JS fills the existing DOM below. -->
    <!--
      Post Loader structure:

      <div class="post-catalog post"></div>

      <div class="post-images post">
          JS generates:
          <div class="post-image post"><img ...></div>
          <div class="post-image post"><img ...></div>
          ...
      </div>

      <div class="post-date post"></div>
      <div class="post-title post"><h2>...</h2></div>
      <div class="post-text post"><p>...</p></div>
      <div class="post-related post"><span>...</span></div>
      <div class="post-tag post"><span>...</span></div>
      <div class="post-readmore post">
          <span></span>
          <span></span>
      </div>
    -->
    <div class="post-catalog post"><span></span></div>
    <div class="post-images post"></div>
    <div class="post-date post"><span></span></div>
    <div class="post-title post"><h2></h2></div>
    <div class="post-tag post"><span></span></div>
    <div class="post-text post"><p></p></div>
    <div class="post-related post"><span></span></div>
    <div class="post-readmore post" hidden>
        <span></span>
        <span></span>
    </div>

</div>

<!-- Immersive mode control: independent control, scoped to out-warper -->
<button type="button" class="reader-btn immersive-toggle" aria-label="Enter immersive mode" title="Enter immersive mode">
    <i data-lucide="maximize-2"></i>
</button>

<!-- 本頁特有內容 END -->

</main-warper>

<footer class="post">
  <div id="reader-loader" class="reader-loader">
    <div class="reader-actions" aria-label="Reader controls">
      <button type="button" class="reader-btn favorite" aria-label="Add to favorites" title="Add to favorites">
        <i data-lucide="heart-plus"></i>
      </button>
      <button type="button" class="reader-btn clear-progress" aria-label="Clear progress" title="Clear progress">
        <i data-lucide="trash"></i>
      </button>
      <button type="button" class="reader-btn save-progress" aria-label="Save progress" title="Save progress">
        <i data-lucide="pin"></i>
      </button>
      <button type="button" class="reader-btn read-done" aria-label="Mark as read" title="Mark as read">
        <i data-lucide="book-dashed"></i>
      </button>
    </div>
    <div class="reader-progress" aria-label="Reading progress">
      <span class="reader-progress-value">0%</span>
      <span class="reader-progress-line" aria-hidden="true"></span>
    </div>
  </div>
  <div class="footer-info"><span>© YURI NO1 · www.yuri1.com</span></div>
</footer>

</div>
</body>
</html>
